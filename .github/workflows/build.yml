name: Build Telegram Mod APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install SDK packages
        run: |
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/tmp/sdk-licenses.txt 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Apply mod patches
        run: python3 scripts/apply_mod_patches.py

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: List Gradle tasks
        run: |
          chmod +x gradlew
          ./gradlew tasks --all --no-daemon 2>&1 | tee /tmp/tasks.txt | tail -80 || true
          grep -i assemble /tmp/tasks.txt || true

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          # Prefer standalone / app release variants that exist in this tree
          ./gradlew :TMessagesProj_AppStandalone:assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/build.log || \
          ./gradlew :TMessagesProj_App:assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/build.log || \
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon 2>&1 | tee /tmp/build.log || \
          ./gradlew :TMessagesProj:assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/build.log || \
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/build.log

      - name: List APKs
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null | head -50 || true
          tail -100 /tmp/build.log || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
