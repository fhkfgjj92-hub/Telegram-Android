name: Build Telegram Mod APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          rm -rf $ANDROID_HOME/cmdline-tools/latest
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install SDK packages
        run: |
          set +e
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses >/tmp/sdk-licenses.txt 2>&1
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          echo "SDK install exit: $?"
          ls -la $ANDROID_HOME || true

      - name: Apply mod patches
        run: python3 scripts/apply_mod_patches.py

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        run: |
          chmod +x gradlew
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon || \
          ./gradlew :TMessagesProj:assembleAfatRelease --stacktrace --no-daemon || \
          ./gradlew :TMessagesProj_App:assembleRelease --stacktrace --no-daemon || \
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: List APKs
        if: always()
        run: find . -name "*.apk" -type f 2>/dev/null | head -40 || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 14
