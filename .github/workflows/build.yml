name: Build Telegram Mod APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1" || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Apply mod patches
        run: python3 scripts/apply_mod_patches.py

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon || \
          ./gradlew :TMessagesProj:assembleAfatRelease --stacktrace --no-daemon || \
          ./gradlew :TMessagesProj_App:assembleRelease --stacktrace --no-daemon || \
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: List APKs
        if: always()
        run: find . -name "*.apk" -type f 2>/dev/null | head -30 || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 14
